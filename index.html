<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{
  --bg:#090c0f;
  --card:#12171d;
  --card2:#171d24;
  --line:#252d36;
  --text:#f6f7f8;
  --muted:#94a0ad;
  --green:#22c982;
  --green2:#103b2c;
  --red:#ff6577;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.35 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

button,input,select{font:inherit}

.app{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  padding:22px 18px 105px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#242a31;
  display:grid;
  place-items:center;
}

.muted{color:var(--muted)}

.hello{
  margin-top:26px;
  font-size:16px;
}

.capital{
  font-size:42px;
  font-weight:900;
  margin:8px 0 2px;
  letter-spacing:-1.5px;
}

.hero{
  margin-top:18px;
  padding:20px;
  border-radius:24px;
  background:linear-gradient(145deg,#0d3a29,#10271f);
  border:1px solid #176141;
}

.hero small{color:#a9d8c5}

.hero .big{
  font-size:34px;
  font-weight:900;
  margin:8px 0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
}

.card b{font-size:20px}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px 0;
}

.btn{
  border:0;
  border-radius:18px;
  padding:16px;
  font-weight:800;
  background:#242b34;
  color:white;
}

.btn.light{
  background:white;
  color:#050607;
}

.btn.green{
  background:var(--green);
  color:#06150f;
}

.btn.danger{
  background:#3a1820;
  color:#ffb5bd;
}

.btn.small{
  padding:10px 12px;
  border-radius:12px;
  font-size:13px;
}

h2{
  font-size:20px;
  margin:26px 0 12px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.row{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.row .main{min-width:0}

.row .name{font-weight:750}

.row .sub{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.amount{
  font-weight:850;
  white-space:nowrap;
}

.positive{color:var(--green)}
.negative{color:var(--red)}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(10,13,16,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:20;
}

.navin{
  width:min(720px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav button{
  background:none;
  border:0;
  color:#77818d;
  padding:12px 4px 10px;
  font-size:11px;
}

.nav button span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.nav button.active{color:white}

.page{display:none}
.page.active{display:block}

.empty{
  padding:24px;
  text-align:center;
  color:var(--muted);
  background:var(--card);
  border-radius:18px;
}

.sheet{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:50;
  display:none;
  align-items:flex-end;
}

.sheet.open{display:flex}

.panel{
  width:100%;
  max-width:720px;
  margin:auto;
  background:#11161c;
  border-radius:26px 26px 0 0;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh;
  overflow:auto;
}

.panelhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.panelhead b{font-size:21px}

.x{
  border:0;
  background:#252c34;
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

.field{margin:11px 0}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin:0 0 6px;
}

.field input,
.field select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #303945;
  background:#0b0f13;
  color:white;
  outline:none;
}

.progress{
  height:8px;
  background:#252c34;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}

.progress i{
  display:block;
  height:100%;
  background:var(--green);
  border-radius:99px;
}

.kpis{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#f4f6f8;
  color:#111;
  padding:11px 16px;
  border-radius:14px;
  font-weight:700;
  z-index:80;
  display:none;
  max-width:88%;
  text-align:center;
}

.toast.show{display:block}

.error{
  background:#391820;
  color:#ffc3ca;
  padding:14px;
  border-radius:16px;
  margin:15px 0;
}

.linkbtn{
  background:none;
  border:0;
  color:#a9c8ff;
  padding:4px;
  font-weight:700;
}

@media(max-width:420px){
  .capital{font-size:37px}
  .hero .big{font-size:31px}
  .app{
    padding-left:16px;
    padding-right:16px;
  }
}
</style>

<style>
.analytics-subtitle{color:#94a3b8;margin:4px 0 20px;font-size:13px}
.analytics-periods{display:flex;gap:8px;overflow-x:auto;padding:5px 0 18px;scrollbar-width:none}
.analytics-periods button{flex-shrink:0;border:1px solid #ffffff19;background:#ffffff0a;color:#b7c2d5;padding:10px 14px;border-radius:12px;font-size:12px}
.analytics-periods button.selected{background:#8b5cf6;color:white;border-color:#8b5cf6}
.analytics-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.analytics-summary>div{background:#ffffff09;border:1px solid #ffffff12;border-radius:17px;padding:15px;min-width:0}
.analytics-summary small{display:block;color:#94a3b8;font-size:11px;margin-bottom:9px}
.analytics-summary strong{display:block;font-size:18px;overflow-wrap:anywhere}
.analytics-panel{background:#ffffff08;border:1px solid #ffffff12;border-radius:20px;padding:17px;margin-bottom:14px;overflow:hidden}
.analytics-panel-title{font-size:15px;font-weight:700;margin-bottom:15px}
.analytics-empty{text-align:center;padding:35px 10px;color:#94a3b8;font-size:13px}
.analytics-hint{font-size:11px;color:#94a3b8;margin:8px 0 13px}
.analytics-svg{width:100%;height:auto;display:block}
.analytics-legend{display:flex;justify-content:center;gap:20px;color:#cbd5e1;font-size:12px;margin-top:10px}
.analytics-bars{display:grid;gap:15px}
.analytics-bar-label{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:7px}
.analytics-bar-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.analytics-bar-label strong{white-space:nowrap}
.analytics-track{height:7px;background:#ffffff13;border-radius:10px;overflow:hidden}
.analytics-fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#38bdf8);border-radius:10px}
.analytics-donut-wrap{display:flex;justify-content:center;padding:12px 0 20px}
.analytics-donut{width:190px;height:190px;border-radius:50%;display:grid;place-items:center}
.analytics-donut-inner{width:135px;height:135px;border-radius:50%;background:#171927;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}
.analytics-donut-inner small{color:#94a3b8;font-size:12px}
.analytics-donut-inner strong{font-size:19px}
.analytics-category-legend{display:grid;gap:12px}
.analytics-category-legend>div{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.analytics-category-legend span{display:flex;align-items:center;gap:8px}
.analytics-category-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.analytics-heatmap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.analytics-day{aspect-ratio:1;border-radius:4px}
.analytics-stats{display:grid;gap:13px}
.analytics-stats>div{display:flex;justify-content:space-between;gap:12px;color:#94a3b8;font-size:12px}
.analytics-stats b{color:#f8fafc}
</style>

<script src="/analytics-ui.js?v=4"></script>

<script>

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#faf8fb');
  tg.setBackgroundColor('#faf8fb');
}

let D = null;

const initData = tg?.initData || '';

const money = n =>
  new Intl.NumberFormat(
    'ru-RU',
    {maximumFractionDigits:0}
  ).format(Number(n || 0)) + ' ₽';

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

const typeName = {
  card:'Карта',
  cash:'Наличные',
  savings:'Накопительный',
  deposit:'Вклад',
  investment:'Инвестиции'
};


async function api(path,opt={}){

  opt.headers = {
    ...(opt.headers || {}),
    'X-Telegram-Init-Data':initData
  };

  if(opt.body){
    opt.headers['Content-Type']='application/json';
  }

  const response = await fetch(
    path,
    opt
  );

  let data = {};

  try{
    data = await response.json();
  }catch{}

  if(!response.ok){
    throw new Error(
      data.detail ||
      'Ошибка сервера'
    );
  }

  return data;
}


function toast(text){

  const element =
    document.getElementById(
      'toast'
    );

  element.textContent=text;

  element.classList.add(
    'show'
  );

  setTimeout(
    () =>
      element.classList.remove(
        'show'
      ),
    2200
  );
}


function openSheet(
  title,
  html
){

  document.getElementById(
    'sheetTitle'
  ).textContent=title;

  document.getElementById(
    'sheetBody'
  ).innerHTML=html;

  document.getElementById(
    'sheet'
  ).classList.add(
    'open'
  );
}


function closeSheet(){

  document.getElementById(
    'sheet'
  ).classList.remove(
    'open'
  );
}


document.getElementById(
  'sheet'
).addEventListener(
  'click',
  event => {

    if(
      event.target.id
      === 'sheet'
    ){
      closeSheet();
    }

  }
);


async function load(){

  try{

    D = await api(
      '/api/dashboard'
    );

    renderAll();

  }catch(error){

    document.getElementById(
      'home'
    ).innerHTML =
      `<div class="error">
      ${esc(error.message)}
      </div>`;

  }

}


function accountOptions(
  selected=''
){

  return D.accounts.map(
    account => `
    <option
      value="${account.id}"
      ${
        String(account.id)
        === String(selected)
        ? 'selected'
        : ''
      }
    >
      ${esc(account.name)}
      ·
      ${money(account.balance)}
    </option>
    `
  ).join('');

}


function categoryOptions(){

  return `
    <option value="">
      Без категории
    </option>
  ` +
  D.categories.map(
    category => `
      <option value="${category.id}">
        ${esc(category.icon || '')}
        ${esc(category.name)}
      </option>
    `
  ).join('');

}


function accountRow(account){

  return `
  <div
    class="row"
    onclick="accountForm(${account.id})"
  >

    <div class="main">

      <div class="name">
        ${esc(account.name)}
      </div>

      <div class="sub">
        ${
          esc(
            account.bank_name ||
            typeName[
              account.account_type
            ] ||
            account.account_type
          )
        }
      </div>

    </div>

    <div class="amount">
      ${money(account.balance)}
    </div>

  </div>
  `;

}


function renderHome(){

  const name =
    D.user.display_name ||
    D.user.telegram_name ||
    'друг';

  let status =
    '🟢 Всё нормально';

  if(
    D.health_mode
    === 'deficit'
  ){
    status =
      '🚨 Есть риск нехватки';
  }

  if(
    D.health_mode
    === 'tight'
  ){
    status =
      '🟡 Деньги впритык';
  }

  document.getElementById(
    'home'
  ).innerHTML = `

  <div class="top">

    <div class="brand">
      FINLY
    </div>

    <div class="avatar">
      ${esc(name[0] || 'F')}
    </div>

  </div>


  <div class="hello muted">
    Привет, ${esc(name)}
  </div>


  <div class="capital">
    ${money(D.total)}
  </div>

  <div class="muted">
    Общий капитал
  </div>


  <div class="hero">

    <small>
      🔥 МОЖНО СЕГОДНЯ
    </small>

    <div class="big">
      ${money(D.today_limit)}
    </div>

    <div class="muted">
      Без ущерба обязательствам
      и накоплениям
    </div>

  </div>


  <div class="grid">

    <div class="card">

      <div class="muted">
        Доступно
      </div>

      <b>
        ${money(D.spendable)}
      </b>

    </div>


    <div class="card">

      <div class="muted">
        Защищено
      </div>

      <b>
        ${money(D.protected)}
      </b>

    </div>

  </div>


  <div class="actions">

    <button
      class="btn light"
      onclick="txForm('expense')"
    >
      − Расход
    </button>

    <button
      class="btn"
      onclick="txForm('income')"
    >
      ＋ Доход
    </button>

  </div>


  <h2>
    Мои деньги
  </h2>


  <div class="list">

    ${
      D.accounts.length
      ?
      D.accounts.map(
        accountRow
      ).join('')
      :
      `
      <div class="empty">
        Добавь первый счёт
      </div>
      `
    }

  </div>


  <h2>
    Состояние
  </h2>


  <div class="card">

    <b>
      ${status}
    </b>

    <div
      class="sub"
      style="margin-top:8px"
    >
      На неделю:
      ${money(D.week_limit)}
      ·
      обязательства:
      ${money(D.obligations)}
    </div>

  </div>

  `;

}


function txRow(transaction){

  const income =
    transaction.transaction_type
    === 'income';

  return `
  <div class="row">

    <div class="main">

      <div class="name">

        ${esc(
          transaction.category_icon
          || ''
        )}

        ${esc(
          transaction.description
          ||
          transaction.category_name
          ||
          (
            income
            ? 'Доход'
            : 'Расход'
          )
        )}

      </div>

      <div class="sub">

        ${esc(
          transaction.account_name
          || ''
        )}

        ·

        ${esc(
          String(
            transaction.created_at
            || ''
          ).slice(
            0,
            16
          )
        )}

      </div>

    </div>


    <div style="text-align:right">

      <div
        class="
          amount
          ${
            income
            ? 'positive'
            : 'negative'
          }
        "
      >

        ${
          income
          ? '+'
          : '−'
        }

        ${money(
          transaction.amount
        )}

      </div>

      <button
        class="linkbtn"
        onclick="editTx(${transaction.id})"
      >
        Изменить
      </button>

      <button
        class="linkbtn"
        onclick="
          deleteTx(
            ${transaction.id}
          )
        "
      >
        Удалить
      </button>

    </div>

  </div>
  `;

}


function renderAnalytics(){
  renderAnalyticsDashboard();
  if (!analyticsData && !analyticsLoading) {
    changeAnalyticsPeriod(analyticsPeriod);
  }
}

function renderAdd(){

  document.getElementById(
    'add'
  ).innerHTML = `

  <div class="top">

    <div class="brand">
      Добавить
    </div>

  </div>


  <h2>
    Операция
  </h2>


  <div class="actions">

    <button
      class="btn light"
      onclick="txForm('expense')"
    >
      − Расход
    </button>

    <button
      class="btn"
      onclick="txForm('income')"
    >
      ＋ Доход
    </button>

  </div>


  <button
    class="btn"
    style="
      width:100%;
      margin-bottom:10px
    "
    onclick="transferForm()"
  >
    ⇄ Перевод между счетами
  </button>


  <h2>
    Финансы
  </h2>


  <div class="list">

    <div
      class="row"
      onclick="accountForm()"
    >

      <div>

        <div class="name">
          ＋ Новый счёт
        </div>

        <div class="sub">
          Карта, наличные,
          накопительный, вклад
        </div>

      </div>

      <b>›</b>

    </div>


    <div
      class="row"
      onclick="goalForm()"
    >

      <div>

        <div class="name">
          ＋ Новая цель
        </div>

        <div class="sub">
          Связать с накопительным
          счётом
        </div>

      </div>

      <b>›</b>

    </div>

  </div>

  `;

}


function goalCurrent(goal){

  const account =
    D.accounts.find(
      item =>
        item.id
        === goal.account_id
    );

  if(account){
    return Number(
      account.balance || 0
    );
  }

  return Number(
    goal.current_amount || 0
  );

}


function renderGoals(){

  document.getElementById(
    'goals'
  ).innerHTML = `

  <div class="top">

    <div class="brand">
      Цели
    </div>

    <button
      class="btn small green"
      onclick="goalForm()"
    >
      ＋ Цель
    </button>

  </div>


  <div
    class="list"
    style="margin-top:24px"
  >

  ${
    D.goals.length
    ?
    D.goals.map(
      goal => {

        const current =
          goalCurrent(goal);

        const percent =
          Math.min(
            100,
            goal.target_amount
            ?
            current
            /
            goal.target_amount
            * 100
            :
            0
          );

        return `

        <div
          class="card"
          onclick="
            goalForm(
              ${goal.id}
            )
          "
        >

          <div
            style="
              display:flex;
              justify-content:
              space-between
            "
          >

            <b>
              ${esc(goal.name)}
            </b>

            <span>
              ${Math.round(percent)}%
            </span>

          </div>


          <div class="sub">

            ${money(current)}
            из
            ${money(
              goal.target_amount
            )}

            ${
              goal.target_date
              ?
              ' · до '
              + esc(
                goal.target_date
              )
              :
              ''
            }

          </div>


          <div class="progress">

            <i
              style="
                width:${percent}%
              "
            ></i>

          </div>

        </div>

        `;

      }
    ).join('')
    :
    `
    <div class="empty">
      Создай цель и привяжи её
      к накопительному счёту
    </div>
    `
  }

  </div>

  `;

}

    Кредиты
  </h2>


  <div class="list">

  ${
    D.loans.length
    ?
    D.loans.map(
      item => `

      <div class="row">

        <div>

          <div class="name">
            ${esc(item.name)}
          </div>

          <div class="sub">
            Остаток
            ${money(
              item.remaining_amount
            )}
          </div>

        </div>

          ${money(
            item.monthly_payment
          )}/мес.

      </div>

      `
    ).join('')
    :

    </div>
    `
  }

  </div>


  <h2>
    Переводы
  </h2>


  <div class="list">

  ${
    D.transfers.length
    ?
    D.transfers.slice(
      0,
      8
    ).map(
      item => `

      <div class="row">

  const date = String(tx.created_at || '').slice(0,10);

  const categories = (D.categories || [])
    .filter(c => !income)
    .map(c => `
      <option value="${Number(c.id)}"

        ${esc(c.icon || '')} ${esc(c.name)}

  openSheet(

    </button>

  );

async function saveEditedTx(id){
  const tx = (D.transactions || []).find(
    item => Number(item.id) === Number(id)
  );

  if(!tx){
    toast('Операция не найдена');
    return;
  }

  const amount = Number(
    document.getElementById('editTxAmount').value.replace(',', '.')
  );

  const accountValue = document.getElementById('editTxAccount').value;
  const categoryElement = document.getElementById('editTxCategory');
  const categoryValue = categoryElement ? categoryElement.value : '';

  const body = {
    amount,
    account_id: accountValue ? Number(accountValue) : null,
    category_id: categoryValue ? Number(categoryValue) : null,
    description: document.getElementById('editTxDescription').value.trim(),
    created_at: document.getElementById('editTxDate').value
  };

  if(!Number.isFinite(amount) || amount <= 0){
    toast('Введите корректную сумму');
    return;
  }

  if(!body.account_id || !body.created_at){
    toast('Выберите счёт и дату');
    return;
  }

  try{
    const result = await api(
      '/api/transactions/' + id,
      {
        method: 'PATCH',
        body: JSON.stringify(body)
      }
    );

    D = result.dashboard;
    closeSheet();
    renderAll();

    if(typeof changeAnalyticsPeriod === 'function'){
      changeAnalyticsPeriod(analyticsPeriod);
    }

    toast('Операция изменена');
  }catch(error){
    toast(error.message);
  }
}

<script>
/* FINLY LAYOUT V4 */
(function(){
  function enhanceHome(){
    const home = document.getElementById('home');
    if(!home || !home.classList.contains('active')) return;

    const capital = home.querySelector('.capital');
    const hello = home.querySelector('.hello');
    const grid = home.querySelector('.grid');
    const hero = home.querySelector('.hero');
    const actions = home.querySelector('.actions');

    if(!capital || !grid || !hero || !actions) return;
    if(home.querySelector('.finly-capital-card')) return;

    const card = document.createElement('div');
    card.className = 'finly-capital-card';

    const label = document.createElement('div');
    label.className = 'finly-capital-label';
    label.textContent = 'ОБЩИЙ КАПИТАЛ';

    capital.parentNode.insertBefore(card, capital);
    card.appendChild(label);
    card.appendChild(capital);
    card.appendChild(grid);

    const budgetTitle = document.createElement('div');
    budgetTitle.className = 'finly-section-eyebrow';
    budgetTitle.textContent = 'ВАШ БЮДЖЕТ НА СЕГОДНЯ';
    hero.parentNode.insertBefore(budgetTitle, hero);

    actions.classList.add('finly-main-actions');
    if(hello) hello.classList.add('finly-home-greeting');
  }

  function enhancePages(){
    const names = {
      analytics:'Ваши финансы',
      add:'Управление деньгами',
      goals:'Копите на важное',
      more:'Всё под контролем'
    };

    Object.entries(names).forEach(([id, subtitle]) => {
      const page = document.getElementById(id);
      if(!page || !page.innerHTML.trim()) return;
      if(page.querySelector('.finly-page-subtitle')) return;

      const brand = page.querySelector('.brand');
      if(!brand) return;

      const subtitleEl = document.createElement('div');
      subtitleEl.className = 'finly-page-subtitle';
      subtitleEl.textContent = subtitle;

      const top = brand.closest('.top');
      if(top) top.insertAdjacentElement('afterend',subtitleEl);
    });
  }

  function apply(){
    enhanceHome();
    enhancePages();
  }

  document.addEventListener('DOMContentLoaded', () => {
    apply();
    const app = document.querySelector('.app');
    if(!app) return;

    const observer = new MutationObserver(() => {
      if(window.finlyLayoutFrame) cancelAnimationFrame(window.finlyLayoutFrame);
      window.finlyLayoutFrame = requestAnimationFrame(apply);
    });

    observer.observe(app, {childList:true,subtree:true});
  });
})();
</script>

(function(){
  const safe = v => String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );

  function draw(){
    const home=document.getElementById('home');
    if(!home || !window.D && typeof D==='undefined')return;
    if(!home.innerHTML.trim())return;

    const transactions=(D.transactions||[]).slice(0,10);
    let box=home.querySelector('.finly-history');

    if(!box){
      box=document.createElement('section');
      box.className='finly-history';
      home.appendChild(box);
    }

    const signature=JSON.stringify(transactions.map(t=>[
      t.id,t.amount,t.category_name,t.transaction_type,t.created_at
    ]));

    if(box.dataset.signature===signature)return;
    box.dataset.signature=signature;

    box.innerHTML=`
      <div class="finly-history-head">
        <h2>Последние операции</h2>
        <button class="finly-history-all" type="button">Все операции →</button>
      </div>
      <div class="finly-history-list">
        ${transactions.length?transactions.map(t=>{
          const income=t.transaction_type==='income';
          return `
            <div class="finly-history-item">
              <div class="finly-history-icon">${income?'↗':'🛍️'}</div>
              <div class="finly-history-info">
                <div class="finly-history-name">${safe(t.category_name||t.description||(income?'Доход':'Расход'))}</div>
                <div class="finly-history-meta">${safe(t.account_name||'')} · ${safe(String(t.created_at||'').slice(0,10))}</div>
              </div>
              <div>
                <div class="finly-history-sum ${income?'income':'expense'}">
                  ${income?'+':'−'}${money(t.amount)}
                </div>
                <button class="finly-history-edit" type="button" data-tx-id="${Number(t.id)}">✎</button>
              </div>
            </div>`;
        }).join(''):'<div class="card muted">Операций пока нет</div>'}
      </div>
    `;

    box.querySelectorAll('[data-tx-id]').forEach(btn=>{
      btn.onclick=()=>editTx(Number(btn.dataset.txId));
    });

    box.querySelector('.finly-history-all').onclick=()=>{
      const nav=document.querySelector('[data-page="analytics"]');
      if(nav)nav.click();
    };
  }

  document.addEventListener('DOMContentLoaded',()=>{
    const home=document.getElementById('home');
    if(!home)return;
    let scheduled=false;
    const observer=new MutationObserver(()=>{
      if(scheduled)return;
      scheduled=true;
      requestAnimationFrame(()=>{
        scheduled=false;
        draw();
      });
    });
    observer.observe(home,{childList:true,subtree:false});
    draw();
  });
})();
</script>

</body>
</html>
